<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteDash - Online Food Ordering</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #f8f9fa; }
        header { background: #ff4757; color: white; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .promo { background: #ffa502; color: white; padding: 10px; text-align: center; font-weight: bold; border-radius: 4px; }
        .menu-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #ddd; }
        .price { color: #ff4757; font-weight: bold; }
        .status { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>BiteDash Portal v1.0 (Stable)</h1>
        <p>Delicious food delivered fast!</p>
    </header>
    <div class="container">
        <div class="promo">🔥 PROMO: Use code BITE20 for 20% off your first order!</div>
        <h2>Restaurant: Gourmet Kitchen</h2>
        <p><strong>Category:</strong> Italian / Continental | <strong>Availability:</strong> <span class="status">Open Now</span></p>
        
        <h3>Menu Items</h3>
        <div class="menu-item">
            <span>Margherita Pizza</span>
            <span class="price">$12.99</span>
        </div>
        <div class="menu-item">
            <span>Creamy Alfredo Pasta</span>
            <span class="price">$14.50</span>
        </div>
    </div>
</body>
</html>
