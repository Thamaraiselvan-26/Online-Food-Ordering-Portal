apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-ordering
      color: blue
  template:
    metadata:
      labels:
        app: food-ordering
        color: blue
    spec:
      containers:
        - name: food-ordering
          image: thamaraiselvan26/food-ordering-portal:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-ordering
      color: green
  template:
    metadata:
      labels:
        app: food-ordering
        color: green
    spec:
      containers:
        - name: food-ordering
          image: thamaraiselvan26/food-ordering-portal:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-service
spec:
  type: NodePort
  selector:
    app: food-ordering
    color: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30014

